<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" role="img" aria-labelledby="title description">
  <title id="title">Search for Linux</title>
  <desc id="description">Go somewhere interesting. A native Linux browser with an editorial start page, vertical tabs, and a shared WebKit engine.</desc>
  <defs>
    <clipPath id="planet"><circle cx="1220" cy="166" r="118"/></clipPath>
  </defs>
  <rect width="1440" height="320" fill="#f1efe9"/>
  <path d="M46 70h1008M46 266h1008" fill="none" stroke="#c1bdb2"/>
  <g font-family="DejaVu Sans Mono,monospace" font-size="12" letter-spacing="2" fill="#595a52">
    <text x="46" y="48">SEARCH / FOR LINUX</text>
    <text x="868" y="48">RUST + WEBKIT</text>
    <text x="46" y="296">VERTICAL TABS</text>
    <text x="265" y="296">LOCAL FIRST</text>
    <text x="466" y="296">NO ACCOUNT REQUIRED</text>
  </g>
  <text x="42" y="172" fill="#272724" font-family="Liberation Serif,Georgia,serif" font-size="84" letter-spacing="-3">Go somewhere <tspan font-style="italic">interesting.</tspan></text>
  <text x="46" y="225" fill="#595a52" font-family="Adwaita Sans,Noto Sans,sans-serif" font-size="18">A browser with room for the web. And a little more character.</text>
  <ellipse cx="1214" cy="166" rx="181" ry="64" transform="rotate(-32 1214 166)" fill="none" stroke="#c1bdb2"/>
  <circle cx="1220" cy="166" r="118" fill="#b74525"/>
  <path d="M1100 219c99 57 142-58 250-38l30 143h-290Z" fill="#272724" clip-path="url(#planet)"/>
  <ellipse cx="1214" cy="166" rx="169" ry="45" transform="rotate(-32 1214 166)" fill="none" stroke="#fcfbf8" stroke-width="20"/>
  <path d="M1119 104a118 118 0 0 1 172-31" fill="none" stroke="#b74525" stroke-width="22"/>
  <circle cx="1083" cy="62" r="8" fill="#fcfbf8" stroke="#272724"/>
</svg>
